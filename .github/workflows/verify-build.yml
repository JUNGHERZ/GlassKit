# ============================================================
# GlassKit – Build Smoke Test + Pages Deploy
#
# Trigger:  Push/PR auf main
# Zweck:    glasskit.min.css und glasskit-styles.js sind .gitignore'd und
#           werden erst im Release-Workflow erzeugt. Ein Syntaxfehler in
#           glasskit.css fiele damit erst beim Tag-Push auf. Dieser Job
#           baut bei jedem Push und prüft, dass beide Artefakte entstehen
#           und die Versionsangabe zu package.json passt.
#
#           Zusätzlich läuft der Versionsabgleich: README-Badges, die drei
#           HTML-Seiten, die CDN-Pins und der oberste CHANGELOG-Eintrag müssen
#           dieselbe Version nennen wie package.json. Das ist mehrfach
#           auseinandergelaufen, ohne dass irgendetwas falsch gerendert hätte.
#
# Pages:    glasskit.jungherz.com wird seit dem 20.09.2026 aus diesem Workflow
#           deployt, nicht mehr über „Deploy from a branch". Dessen interner
#           Trigger hat 7 der letzten 40 Pushes auf main ausgelassen (zuletzt
#           v1.12.0 und v1.14.0), ohne Muster und ohne Incident — dieser
#           Workflow lief bei jedem. Der Deploy hängt hinter den Prüfungen:
#           eine Seite mit veraltetem Badge geht nicht mehr live. Das
#           Artefakt ist der Repo-Stand plus die gebauten Artefakte, ohne
#           Jekyll dazwischen (der Legacy-Build ist am 17.08.2026 einmal
#           daran gescheitert).
#
# Lokal:    npm run build && npm run check:versions
# ============================================================

name: Verify Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write   # OIDC-Token für actions/deploy-pages

jobs:
  verify:
    name: Build artifacts from source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Artifacts exist and carry the package version
        run: |
          set -e
          test -s glasskit.min.css      || { echo "::error::glasskit.min.css missing or empty"; exit 1; }
          test -s glasskit-styles.js    || { echo "::error::glasskit-styles.js missing or empty"; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          grep -q "GlassKit v${VERSION}" glasskit-styles.js \
            || { echo "::error::glasskit-styles.js header does not say v${VERSION}"; exit 1; }
          grep -q "v${VERSION}" glasskit.css \
            || { echo "::error::glasskit.css header does not say v${VERSION}"; exit 1; }
          echo "OK – artifacts built for v${VERSION}"

      - name: Documented versions match package.json
        run: npm run check:versions

      - name: The package carries every file it points to
        run: npm run check:package

      # ---- Pages-Artefakt (nur Push auf main, nicht für PRs) ----
      # Der Repo-Stand wie ihn der Legacy-Build auslieferte, plus min.css und
      # styles.js aus dem Build oben. Nichts wird durch Jekyll geschickt.
      - name: Assemble the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude '_site' ./ _site/
          du -sh _site && ls _site | head -30

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy site to GitHub Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Nie zwei Deploys gleichzeitig; ein laufender wird nicht abgebrochen,
    # damit kein halb ausgelieferter Stand entsteht.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
